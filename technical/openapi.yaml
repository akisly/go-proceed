    {
      "bearerAuth": []
    }
  ],
  "tags": [
    {
      "name": "Acquisition",
      "description": "Public privacy-minimized Pilot qualification intake."
    },
    {
      "name": "Organizations",
      "description": "Workspace lifecycle and immutable tenant context."
    },
    {
      "name": "Access",
      "description": "Membership roles scopes invitations and ownership."
    },
    {
      "name": "Projects",
      "description": "Project location and operational setup."
    },
    {
      "name": "Work",
      "description": "Contract work items assignments and status."
    },
    {
      "name": "Imports",
      "description": "Private estimate upload dry-run reconciliation and publish."
    },
    {
      "name": "Evidence",
      "description": "Offline capture uploads immutable originals and corrections."
    },
    {
      "name": "Reviews",
      "description": "Internal review queue and append-only decisions."
    },
    {
      "name": "Rules",
      "description": "Versioned evidence rules requirements waivers and readiness."
    },
    {
      "name": "Variations",
      "description": "GA change notice versions and decisions."
    },
    {
      "name": "Packages",
      "description": "Periods preflight immutable packages submissions and receipts."
    },
    {
      "name": "ExternalReview",
      "description": "GA exact-version capability sessions and decisions."
    },
    {
      "name": "Receivables",
      "description": "GA project receivables payments allocations and retention."
    },
    {
      "name": "Subscription",
      "description": "AktFlow plan entitlement and SaaS invoice lifecycle."
    },
    {
      "name": "Notifications",
      "description": "Pilot in-app notifications and preferences; GA adds approved external providers and escalation policies."
    },
    {
      "name": "Integrations",
      "description": "GA scoped connections webhooks delivery and replay."
    },
    {
      "name": "Operations",
      "description": "Jobs exports support grants and platform-safe operations."
    }
