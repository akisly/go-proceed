              {
                "type": "string",
                "maxLength": 80
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "allOf": [
          {
            "if": {
              "required": [
                "supersedesAcceptanceRecordId"
              ],
              "properties": {
                "supersedesAcceptanceRecordId": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "then": {
              "required": [
                "expectedAcceptanceRecordVersion"
              ],
              "properties": {
                "supersedesAcceptanceRecordId": {
                  "type": "string",
                  "format": "uuid"
                },
                "expectedAcceptanceRecordVersion": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "state": {
                  "enum": [
                    "pending",
                    "returned",
                    "disputed"
                  ]
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "properties": {
                "acceptedAmount": {
                  "type": "object",
                  "required": [
                    "amountMinor",
                    "currency"
                  ],
                  "properties": {
                    "amountMinor": {
                      "const": 0
                    },
                    "currency": {
                      "type": "string",
                      "pattern": "^[A-Z]{3}$"
                    }
                  }
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "state": {
                  "enum": [
                    "partially_accepted",
                    "accepted"
                  ]
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "properties": {
                "acceptedAmount": {
                  "type": "object",
                  "required": [
                    "amountMinor",
                    "currency"
                  ],
                  "properties": {
                    "amountMinor": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "currency": {
                      "type": "string",
                      "pattern": "^[A-Z]{3}$"
                    }
                  }
                }
              }
            }
          }
        ],
        "description": "Append an exact-package acceptance head. A successor is rejected with ACCEPTANCE_DOWNSTREAM_LOCKED while any non-cancelled receivable references the current head; downstream money must be resolved first rather than silently rewritten."
      },
