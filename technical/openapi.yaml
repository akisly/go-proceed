                        "format": "uuid"
                      },
                      "transferGroupId": {
                        "type": "null"
                      }
                    }
                  }
                },
                {
                  "if": {
                    "properties": {
                      "entryType": {
                        "const": "reversal"
                      }
                    },
                    "required": [
                      "entryType"
                    ]
                  },
                  "then": {
                    "required": [
                      "reasonCode",
                      "correctsEntryId"
                    ],
                    "properties": {
                      "quantity": {
                        "type": "string",
                        "pattern": "^-(?:0*[1-9][0-9]*(?:\\.[0-9]{1,6})?|0+\\.(?:0{0,5}[1-9][0-9]{0,5}))$"
                      },
                      "reasonCode": {
                        "type": "string",
                        "minLength": 1
                      },
                      "correctsEntryId": {
                        "type": "string",
                        "format": "uuid"
                      },
                      "transferGroupId": {
                        "type": "null"
                      }
                    }
                  }
                }
