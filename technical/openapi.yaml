              "allOf": [
                {
                  "if": {
                    "properties": {
                      "entryType": {
                        "const": "progress"
                      }
                    },
                    "required": [
                      "entryType"
                    ]
                  },
                  "then": {
                    "properties": {
                      "quantity": {
                        "type": "string",
                        "pattern": "^(?:0*[1-9][0-9]*(?:\\.[0-9]{1,6})?|0+\\.(?:0{0,5}[1-9][0-9]{0,5}))$"
                      },
                      "reasonCode": {
                        "type": "null"
                      },
                      "correctsEntryId": {
                        "type": "null"
                      },
                      "transferGroupId": {
                        "type": "null"
                      }
                    }
                  }
                },
                {
                  "if": {
                    "properties": {
                      "entryType": {
                        "const": "correction"
                      }
                    },
                    "required": [
                      "entryType"
                    ]
                  },
                  "then": {
                    "required": [
                      "reasonCode",
                      "correctsEntryId"
                    ],
                    "properties": {
                      "quantity": {
                        "type": "string",
                        "pattern": "^-?(?:0*[1-9][0-9]*(?:\\.[0-9]{1,6})?|0+\\.(?:0{0,5}[1-9][0-9]{0,5}))$"
                      },
                      "reasonCode": {
                        "type": "string",
                        "minLength": 1
