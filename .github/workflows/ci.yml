name: ci
on:
  push: { branches: [main] }
  pull_request: {}
# ACTION MAJORS DECLARE THE node24 RUNTIME.
#
# GitHub is retiring the Node 20 runtime that executes JavaScript actions. Every
# action below previously declared `using: node20` in its own action.yml, so runs
# annotated: "Node.js 20 is deprecated ... being forced to run on Node.js 24".
#
# This was never about the Node this project uses — .nvmrc is 24 and the jobs
# already pin node-version 24. It is only about the runtime the actions
# themselves execute on.
#
# Verified per pin rather than assumed, by reading `runs.using` out of each
# action.yml at the exact commit pinned below. GitHub's annotation named only
# four actions; setup-python and upload-artifact were node20 too and are fixed
# here as well.
#
#   actions/checkout        v4 -> v7.0.1    node20 -> node24
#   actions/setup-node      v4 -> v7.0.0    node20 -> node24
#   actions/setup-python    v5 -> v7.0.0    node20 -> node24
#   actions/upload-artifact v4 -> v7.0.1    node20 -> node24
#   pnpm/action-setup       v4 -> v6.0.10   node20 -> node24
#   supabase/setup-cli      v1 -> v3.0.0    node20 -> composite
#
# supabase/setup-cli is the one substantive rewrite: v3 is a composite action,
# which runs no Node at all and so leaves this deprecation entirely. Its
# `version` input still accepts `latest`, which is all this workflow passes. If
# `verify` fails at "supabase start", suspect that upgrade first.
#
# Pins stay SHA-based, not tags, for the same reason as the permissions block
# below: a moved tag is a supply-chain vector. The trailing comment is the tag
# the SHA belonged to when it was pinned, not a resolution instruction.
# Least privilege: nothing here writes to the repo; a hijacked third-party
# action must not inherit a write-capable GITHUB_TOKEN.
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local Supabase Postgres, reachable once `supabase start` has come up.
      # 'app_pw' is a local/CI-only dev password set by supabase/seed.sql
      # (applied by `supabase start` / `supabase db reset`, both below) —
      # never by a migration, so a *default* `supabase db push` (the
      # documented staging/prod path, migrations only) never applies it.
      # This value must never be used against a hosted/real project — see
      # infra/README-staging.md §3 for the commands that DO apply seed.sql
      # and must never be run there.
      APP_DB_URL: postgresql://aktflow_app_login:app_pw@127.0.0.1:54322/postgres
      # The service principal's connection (migration 0034). Set by the same
      # local-credentials script as APP_DB_URL, one step below.
      SERVICE_DB_URL: postgresql://aktflow_service_login:service_pw@127.0.0.1:54322/postgres
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # next build only needs these present (not real secrets) — no page in
      # this app hits Supabase at build time, but supabaseServer() reads them
      # eagerly, so an unset var would still be a footgun for future routes.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.12.0 }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Documentation gate. Runs before the Supabase steps, which are allowed
      # fifteen minutes, so a documentation failure reports in about a minute
      # rather than after a full local-stack boot. Needs no database and no
      # build — it reads the tree.
      - run: pnpm validate:canonical-docs

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with: { version: latest }

      # Cold runners pull the full local Postgres/GoTrue/Kong image set on
      # first boot, which is slow — give this room instead of relying on the
      # job-level timeout to cover it.
      - name: supabase start
        timeout-minutes: 15
        run: supabase start

      # Applies the migration chain in order and loads supabase/seed.sql
      # (the AUTH_USER_A / AUTH_USER_B fixtures the RLS + integration suites
      # depend on; seed.sql no longer sets any credential).
      - name: supabase db reset
        run: supabase db reset

      # Dev-only password for aktflow_app_login — set by a local-host-only
      # script, never by seed.sql (see scripts/set-local-app-password.mjs).
      - name: Set local app-role password (never via seed.sql)
        run: pnpm db:local-credentials

      - run: pnpm turbo run typecheck

      # --concurrency=1 is load-bearing, not a style choice: @goproceed/database,
      # @goproceed/testing (the RLS negative-policy suite), and @goproceed/app's
      # integration tests all hit the SAME local Postgres instance and
      # truncate/reset overlapping tables. apps/app already serializes its own
      # test files via vitest's fileParallelism:false, but turbo will happily
      # run different packages' `test` tasks concurrently unless told not to,
      # which would let one package's truncate race another's in-flight
      # transaction. Serialize across the whole run instead of trying to
      # enumerate which suites are "safe" to parallelize.
      - run: pnpm turbo run test --concurrency=1

      - run: pnpm turbo run build

  # apps/demo is standalone (no Supabase dependency), so it gets its own job
  # rather than folding into `verify` above. This also covers Finding 3: CI
  # previously ran no browser assertion at all.
  demo-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.12.0 }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/demo/qa/browser.mjs uses full `puppeteer`, which downloads a
      # pinned Chrome for Testing build at install time. pnpm may skip
      # dependency lifecycle (postinstall) scripts depending on config, so
      # don't assume the download happened — invoke puppeteer's own
      # installer explicitly. It is a no-op if the pinned build is already
      # present.
      - name: Ensure puppeteer's pinned Chrome is installed
        working-directory: apps/demo
        run: pnpm exec puppeteer browsers install chrome

      # Chrome for Testing needs the same shared libraries as any Chrome
      # build. ubuntu-latest ships a system Chrome (and therefore most of
      # these transitively), but that has changed under us before — install
      # explicitly rather than relying on an incidental side effect of an
      # unrelated preinstalled package.
      - name: Install Chrome headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 \
            libatk1.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 \
            libgtk-3-0 libnspr4 libnss3 libxcomposite1 libxdamage1 \
            libxfixes3 libxkbcommon0 libxrandr2 xdg-utils

      # Verify the browser actually launches on this runner before trusting
      # any downstream step's result — reuses the harness's own launch()
      # (including its AKTFLOW_CHROME_PATH override) so this checks the
      # exact code path `qa` below depends on, not a stand-in.
      - name: Verify Chrome launches
        working-directory: apps/demo
        run: |
          node --input-type=module -e "
          import { launch } from './qa/browser.mjs';
          const browser = await launch();
          console.log('Chrome launched:', await browser.version());
          await browser.close();
          "

      - run: pnpm --filter @goproceed/demo typecheck
      - run: pnpm --filter @goproceed/demo lint
      - run: pnpm --filter @goproceed/demo test

      # THE DEPLOY-TIME PLACEHOLDER GATE, ON THE PATH THAT ACTUALLY PUBLISHES.
      #
      # `qa/preflight.mjs` exits 1 on any unreplaced `{{TOKEN}}` in apps/demo/src.
      # It existed and was run by NOBODY: this job ran typecheck, lint, test,
      # build and qa, and `qa`'s own scan of the same tokens is report-only and
      # does not fail. Vercel deploys on every PR, so "run it before publishing"
      # meant "run it before something that happens automatically" — which is to
      # say it was never run at all. /legal/privacy shipped `{{FORM_PROCESSOR}}`
      # twice, inside <code>, in the sentences naming who processes a visitor's
      # personal data.
      #
      # IT IS GREEN, AND THAT IS THE PRECONDITION FOR ADDING IT. preflight.mjs's
      # own header refuses to be part of a default suite while a token is
      # genuinely unresolved, and it is right: «a suite that is red by design
      # trains everyone to ignore red and buries genuine regressions behind a
      # known, deliberate failure». So the token was resolved FIRST — the
      # disclosure no longer names a service, because there is none to name (see
      # src/pages/Legal.tsx) — and this line is what now stops the NEXT one.
      #
      # It runs before `build`, because it needs no build: it reads src/, so a
      # placeholder failure reports in seconds rather than after a bundle.
      - run: pnpm --filter @goproceed/demo preflight

      - run: pnpm --filter @goproceed/demo build
      - run: pnpm --filter @goproceed/demo qa

      # apps/demo/qa/verify.mjs writes every generated artifact under the
      # gitignored qa-output/ (see its FINDING 1 comment). Unlike
      # prototype/'s harness (see package-validate below), a QA run here
      # must never touch a tracked file — assert it.
      - name: Assert apps/demo QA run left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "apps/demo qa run modified the working tree:"
            git status --porcelain
            exit 1
          fi

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-qa-output
          path: apps/demo/qa-output/
          retention-days: 14

  # Runs the prototype/ package-contract validator (scripts/validate_package.py
  # + prototype's own lint/build/qa) — previously nothing in CI ran this at
  # all, so neither the package contract nor A.4.19 had any CI enforcement.
  package-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }

      # NPM, NOT PNPM — and no pnpm/action-setup at all.
      #
      # This job installs with `npm --prefix prototype ci` and then runs
      # `make validate`, which is entirely `npm --prefix prototype …` plus
      # scripts/validate_package.py. Nothing in the Makefile or scripts/ calls
      # pnpm, so the pnpm/action-setup step here was unused.
      #
      # More than unused: `cache: pnpm` made setup-node resolve the pnpm store
      # path and register a post-job save for it. Since `pnpm install` never
      # runs in this job the store is never created, so every run ended with
      #
      #   Error: Path Validation Error: Path(s) specified in the action for
      #   caching do(es) not exist, hence no cache is being saved.
      #
      # It was not a broken cache, it was a cache that could never work —
      # pointed at a package manager this job does not use. Caching npm against
      # prototype/package-lock.json is the version that actually caches the
      # dependencies this job actually installs.
      #
      # The other two jobs both run `pnpm install --frozen-lockfile`, so their
      # `cache: pnpm` is correct and is left alone.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - run: npm --prefix prototype ci

      - run: make validate

      # ---------------------------------------------------------------
      # NOTE: no "git diff --exit-code -- prototype" step here, by design.
      #
      # `make validate` (the validate-qa target) runs
      # `npm --prefix prototype run qa`, whose verify.mjs *regenerates*
      # prototype/qa-results.json and the 19 tracked PNGs under
      # prototype/qa-screenshots/ on every single run — including a run
      # against an untouched, freshly-checked-out HEAD. On the host this
      # workflow was authored on, a clean-checkout `make validate` exits 0
      # but leaves 14 tracked files modified (qa-results.json plus 13 of
      # the 19 screenshots). scripts/validate_package.py:2435-2447 then
      # reads qa-results.json and requires those screenshots to exist,
      # so validating and leaving the tree clean are mutually exclusive
      # with the current prototype/ harness: asserting a clean diff here
      # would fail on every run, including ones that changed nothing.
      #
      # This is measured, pre-existing repository behaviour, not a bug in
      # this workflow, and prototype/ is out of scope to change to fix it
      # (see docs/legacy/40-phase1-discovery-outreach.md §A.6 for the deferred-debt
      # record, and its A.4.19 note for why that acceptance criterion's two
      # halves cannot both be satisfied without changing prototype/). Do
      # not "fix" this by adding the assertion back.
      #
      # The clean-tree contract this repository *can* uphold — that running
      # a QA harness must not dirty the working tree — is enforced above,
      # in demo-qa, against apps/demo's harness instead, which genuinely
      # satisfies it by writing to a gitignored directory.
      # ---------------------------------------------------------------
