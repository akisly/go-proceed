name: ci
on:
  push: { branches: [main] }
  pull_request: {}
# ACTION MAJORS DECLARE THE node24 RUNTIME.
#
# GitHub is retiring the Node 20 runtime that executes JavaScript actions. Every
# action below previously declared `using: node20` in its own action.yml, so runs
# annotated: "Node.js 20 is deprecated ... being forced to run on Node.js 24".
#
# This was never about the Node this project uses — .nvmrc is 24 and the jobs
# already pin node-version 24. It is only about the runtime the actions
# themselves execute on.
#
# Verified per pin rather than assumed, by reading `runs.using` out of each
# action.yml at the exact commit pinned below. GitHub's annotation named only
# four actions; setup-python and upload-artifact were node20 too and are fixed
# here as well.
#
#   actions/checkout        v4 -> v7.0.1    node20 -> node24
#   actions/setup-node      v4 -> v7.0.0    node20 -> node24
#   actions/setup-python    v5 -> v7.0.0    node20 -> node24  (no job uses it now)
#   actions/upload-artifact v4 -> v7.0.1    node20 -> node24
#   pnpm/action-setup       v4 -> v6.0.10   node20 -> node24
#   supabase/setup-cli      v1 -> v3.0.0    node20 -> composite
#
# supabase/setup-cli is the one substantive rewrite: v3 is a composite action,
# which runs no Node at all and so leaves this deprecation entirely. Its
# `version` input accepts an exact version, which is what this workflow now
# passes — read from `.supabase-cli-version` (see the `verify` job). If `verify`
# fails at "supabase start" right after a CLI bump, suspect the bump first.
#
# Pins stay SHA-based, not tags, for the same reason as the permissions block
# below: a moved tag is a supply-chain vector. The trailing comment is the tag
# the SHA belonged to when it was pinned, not a resolution instruction.
# Least privilege: nothing here writes to the repo; a hijacked third-party
# action must not inherit a write-capable GITHUB_TOKEN.
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local Supabase Postgres, reachable once `supabase start` has come up.
      # 'app_pw' is a local/CI-only dev password set by supabase/seed.sql
      # (applied by `supabase start` / `supabase db reset`, both below) —
      # never by a migration, so a *default* `supabase db push` (the
      # documented staging/prod path, migrations only) never applies it.
      # This value must never be used against a hosted/real project — see
      # infra/README-staging.md §3 for the commands that DO apply seed.sql
      # and must never be run there.
      APP_DB_URL: postgresql://goproceed_app_login:app_pw@127.0.0.1:54322/postgres
      # The service principal's connection (migration 0034). Set by the same
      # local-credentials script as APP_DB_URL, one step below.
      SERVICE_DB_URL: postgresql://goproceed_service_login:service_pw@127.0.0.1:54322/postgres
      # The evidence purge worker's own login (migration 0090, DEV-036), set by
      # the same local-credentials script. It has no fallback URL.
      PURGE_DB_URL: postgresql://goproceed_purge_worker_login:purge_pw@127.0.0.1:54322/postgres
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # THE ISOLATED INTEGRATION SUITES SKIP THEMSELVES WITHOUT THIS. apps/app's
      # tests/helpers/fixtures.ts (`hasIsolatedDatabaseCredentials`) turns seven
      # suites into `describe.skip` unless APP_DB_URL, SERVICE_DB_URL AND
      # TEST_DB_ADMIN_URL are all set — and until 2026-09-02 this one was not
      # set here, so the Telegram evidence/processing/delivery paths,
      # m3-refusal and the upload-intent suites (125 tests) reported `skipped`
      # inside a green run. It is the same local admin connection as
      # SUPABASE_DB_URL, named for the fixtures. Declared in turbo.json
      # `test.env` as well: turbo's strict env mode withholds undeclared
      # variables from the task, and a variable vitest cannot see is unset.
      TEST_DB_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # next build only needs these present (not real secrets) — no page in
      # this app hits Supabase at build time, but supabaseServer() reads them
      # eagerly, so an unset var would still be a footgun for future routes.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.12.0 }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Documentation gate. Runs before the Supabase steps, which are allowed
      # fifteen minutes, so a documentation failure reports in about a minute
      # rather than after a full local-stack boot. Needs no database and no
      # build — it reads the tree.
      - run: pnpm validate:canonical-docs

      # Agent profiles gate. `.claude/agents` and `.codex/agents` are generated
      # from `agents/` by scripts/sync-agents.py; this fails when a generated
      # profile drifts from its canonical source, or when the registry breaks
      # its own rules (only gp-implementer may write, read roles carry no edit
      # tools). Needs Python 3.11+ for tomllib: ubuntu-latest ships 3.12, and
      # the step prints the version it actually used so a runner-image change
      # is visible in the log rather than inferred.
      - run: python3 --version && pnpm validate:agents

      # Lockfile gate (BL-083, DEV-068): one @types/react, @types/react-dom
      # and typescript for every importer, every react-dom paired with the
      # same react, and one react pair across the web apps. pnpm 9 privately
      # hoists whichever copy it lists first, so a second version splits the
      # web programs at random (DEV-008). Reads the lockfile only.
      - run: pnpm validate:lockfile

      # THE CLI IS PINNED, AND THE PIN LIVES IN ONE FILE. Until 2026-08-18 this
      # asked setup-cli for `version: latest`, so the SHA-pinned ACTION was
      # reproducible and the TOOL it installed was not: local development ran
      # 2.75.0 while CI resolved whatever shipped that morning — 2.115.0 on the
      # day this was pinned, and it had moved from 2.114.0 to 2.115.0 during
      # the hour the pin was being decided. HANDOFF.md §0 records what that
      # costs in practice: the magic-link OTP template stopped carrying
      # `{{ .Token }}` in a newer CLI default and app-qa went red three times
      # for a change no commit explained. A green build that depends on an
      # unpinned tool is a build whose result can change overnight.
      #
      # `.supabase-cli-version` at the repo root is the single source, mirroring
      # `.nvmrc`. Both jobs below read it, so the two pins cannot drift from
      # each other or from the file; `supabase/config.toml` and the local
      # scripts name the same file for the developer's own machine. Bumping the
      # CLI is therefore ONE edit that names the version, in a commit that can
      # be bisected — which is the entire point.
      - name: Read the pinned Supabase CLI version
        id: supabase-cli
        run: echo "version=$(tr -d '[:space:]' < .supabase-cli-version)" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      # Prove the pin took, and PRINT the version into the log. Until now no
      # step recorded which CLI actually ran, so «which version failed?» could
      # not be answered from a red run — the same blindness the pin exists to
      # remove.
      - name: Assert the installed CLI is the pinned one
        run: |
          want="$(tr -d '[:space:]' < .supabase-cli-version)"
          have="$(supabase --version 2>/dev/null | head -1 | tr -d '[:space:]')"
          echo "supabase CLI: want ${want}, have ${have}"
          [ "$have" = "$want" ] || { echo "::error::pinned ${want} but setup-cli installed ${have}"; exit 1; }

      # Cold runners pull the full local Postgres/GoTrue/Kong image set on
      # first boot, which is slow — give this room instead of relying on the
      # job-level timeout to cover it.
      #
      # ONLY THE FIVE CONTAINERS THE SUITES USE ARE STARTED. `-x` is the CLI's
      # own exclusion flag (vocabulary read from the pinned CLI's
      # `legacy-service-catalog.ts`: gotrue, realtime, storage-api, imgproxy,
      # kong, mailpit, postgrest, postgres-meta, studio, edge-runtime, logflare,
      # vector, supavisor). What stays: Postgres (never excludable), Kong (the
      # API gateway at :54321), GoTrue (OTP sign-in), Mailpit (the OTP code is
      # read back out of it) and storage-api (the `evidence` bucket). What goes
      # has no consumer in this repository — `git grep` finds no `.from(`, no
      # `.channel(`, no `functions/v1`, nothing on the Studio, pg-meta or
      # analytics ports — and was exactly where the two 2026-08-19 red runs
      # died: `supabase start` waiting eight minutes for the analytics `vector`
      # container to go healthy (run 32234277131, a docs-only commit), and
      # `db reset`'s one-shot migrate container reported `exit 125` by the
      # docker CLI — the daemon failing to run a container, not a migration
      # failing (run 32239195945; `verify` passed the identical step minutes
      # earlier on another runner). Fewer containers is fewer pulls, less
      # memory on a 4-vCPU runner, and fewer health checks to lose. `db reset`
      # tolerates an excluded service: its satellite restart ignores "not
      # found" by design (CLI `restart-services.ts`), and the one-shot
      # Realtime/Storage/Auth migrate jobs key on config.toml, not on what is
      # running, so the schema those services own is still initialised.
      # Proved locally against this exact list on 2026-08-19: all six suites
      # (`turbo run test --concurrency=1`, 1637 tests) and the app-qa browser
      # pass (5/5 audits, a real OTP sign-in through Kong → GoTrue → Mailpit)
      # green on a stack started with it.
      # https://supabase.com/docs/reference/cli/supabase-start
      - name: supabase start
        timeout-minutes: 15
        run: supabase start -x studio,postgres-meta,logflare,vector,edge-runtime,realtime,postgrest

      # Applies the migration chain in order and loads supabase/seed.sql
      # (the AUTH_USER_A / AUTH_USER_B fixtures the RLS + integration suites
      # depend on; seed.sql no longer sets any credential).
      #
      # ONE RETRY, AND THE FIRST FAILURE IS NOT HIDDEN. The step recreates the
      # Postgres container and runs three one-shot Docker jobs against it, and
      # on a shared runner the daemon itself sometimes fails to run one of them
      # (`error running container: exit 125`, see the `supabase start` comment
      # above). A deterministic failure — a broken migration, a seed that no
      # longer applies — fails both attempts and the job stays red; a daemon
      # hiccup passes on the second attempt with a `::warning::` in the
      # annotations, so the flake count is visible rather than silently
      # absorbed. If the first attempt died before the new Postgres container
      # existed, the retry fails fast with "supabase start is not running",
      # which is the correct, loud outcome for that rarer case.
      - name: supabase db reset
        run: |
          if supabase db reset; then exit 0; fi
          echo "::warning::supabase db reset failed once (runner Docker?) — retrying the step a single time"
          supabase db reset

      # Dev-only password for goproceed_app_login — set by a local-host-only
      # script, never by seed.sql (see scripts/set-local-app-password.mjs).
      - name: Set local app-role password (never via seed.sql)
        run: pnpm db:local-credentials

      - run: pnpm turbo run typecheck

      # --concurrency=1 is load-bearing, not a style choice: @goproceed/database,
      # @goproceed/testing (the RLS negative-policy suite), and @goproceed/app's
      # integration tests all hit the SAME local Postgres instance and
      # truncate/reset overlapping tables. apps/app already serializes its own
      # test files via vitest's fileParallelism:false, but turbo will happily
      # run different packages' `test` tasks concurrently unless told not to,
      # which would let one package's truncate race another's in-flight
      # transaction. Serialize across the whole run instead of trying to
      # enumerate which suites are "safe" to parallelize.
      - run: pnpm turbo run test --concurrency=1

      - run: pnpm turbo run build
  # THE `demo-qa` JOB WAS REMOVED ON 2026-08-20, WITH `apps/demo` ITSELF.
  #
  # It built apps/demo and ran its puppeteer pass. The demo was never a product
  # surface — README already filed it as «legacy reference material» and said
  # the durable, isolated `/demo` arrives inside `apps/app` — so the app it
  # guarded is gone and the job goes with it. What it uniquely covered (a
  # browser assertion against a standalone Vite build, and the demo's own unit
  # suite, which no other job ran) is not re-homed: there is nothing left to
  # assert it against. `app-qa` below remains the repository's browser pass.

  # apps/app's browser pass (qa/field.mjs) — task 11 of the PWA field client
  # plan. It was modelled on the retired demo-qa job (same puppeteer version,
  # same launcher, same Chrome-install steps, same clean-tree contract), but
  # apps/app was never standalone the way the demo was: its pages are gated by
  # proxy.ts and render real data through /v1, so most of what it exists to catch —
  # the довідковий disclaimer, the 44px touch floor on the obligation screen,
  # the unsaved-photo banner (INV-081) — lives behind a real Supabase session.
  # This job therefore ALSO carries `verify`'s own Supabase bring-up
  # (setup-cli, start, db reset, db:local-credentials) — the one respect in
  # which it could never just be that job with the filter swapped. See
  # qa/field.mjs's own header comment for exactly what this buys and what it
  # still does not cover.
  # [2026-09-23, DEV-035] The field PWA was retired by the owner: the
  # disclaimer, the obligation screen's touch floor and the INV-081 banner are
  # no longer in apps/app, and this job no longer covers them. It covers the
  # office dashboard. The field client is now apps/mobile's native build
  # (ADR-013); it has no browser or device harness, in CI or out of it (BL-135).
  app-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same local-only values `verify` above uses, for the same reason (see
      # that job's own env block) — this job needs its own Supabase stack
      # because GitHub Actions jobs do not share state.
      APP_DB_URL: postgresql://goproceed_app_login:app_pw@127.0.0.1:54322/postgres
      SERVICE_DB_URL: postgresql://goproceed_service_login:service_pw@127.0.0.1:54322/postgres
      PURGE_DB_URL: postgresql://goproceed_purge_worker_login:purge_pw@127.0.0.1:54322/postgres
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # UNLIKE `verify`'s build (which uses a placeholder — no page there hits
      # Supabase at build time), this job's build MUST use the real local
      # publishable key: qa/field.mjs signs a real user in through the browser,
      # and `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY` is compiled into the client
      # bundle, not read at request time. The value below is `supabase start`'s
      # fixed local `sb_publishable_…` key (deterministic across every fresh
      # local stack — see qa/field.mjs's own header for the same key and why it
      # is stable, and scripts/set-local-app-password.mjs for the sibling
      # dev-only-default convention this follows). It was the legacy anon JWT
      # until 2026-08-19; the legacy keys stop working at the end of 2026 and
      # the app's SDK now handles the new family explicitly.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.12.0 }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same pin, same file, same assertion as `verify` — see the comment there.
      - name: Read the pinned Supabase CLI version
        id: supabase-cli
        run: echo "version=$(tr -d '[:space:]' < .supabase-cli-version)" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      - name: Assert the installed CLI is the pinned one
        run: |
          want="$(tr -d '[:space:]' < .supabase-cli-version)"
          have="$(supabase --version 2>/dev/null | head -1 | tr -d '[:space:]')"
          echo "supabase CLI: want ${want}, have ${have}"
          [ "$have" = "$want" ] || { echo "::error::pinned ${want} but setup-cli installed ${have}"; exit 1; }

      # Same five containers, same exclusion list, same reasoning as `verify`'s
      # step — see the comment there. The browser pass needs exactly what the
      # suites need: Postgres, Kong, GoTrue, Mailpit, storage-api.
      - name: supabase start
        timeout-minutes: 15
        run: supabase start -x studio,postgres-meta,logflare,vector,edge-runtime,realtime,postgrest

      # Mailpit readiness probe — same spirit as "Verify Chrome launches"
      # below: turn an infrastructure problem into an infrastructure-shaped
      # failure instead of letting it masquerade as a product bug.
      #
      # `qa/field.mjs`'s sign-in audit drives the REAL email-OTP screen and
      # reads the code back out of Mailpit's REST API (`MAILPIT_URL`,
      # default http://127.0.0.1:54324) — `supabase start`'s own log line
      # above (`│ Mailpit │ http://127.0.0.1:54324 │`) says the container is
      # up, but "the log line printed" and "the API answers HTTP requests"
      # are different claims, and only the second one is what qa/field.mjs
      # actually depends on. Without this, a Mailpit that is merely slow to
      # finish starting (or genuinely broken) failed AT `readOtpCode`,
      # inside the sign-in audit, which used to be misread as a product
      # defect in login rather than infrastructure not being ready — see
      # readOtpCode's own header in apps/app/qa/field.mjs for the full
      # account of that failure mode.
      - name: Verify Mailpit API is reachable
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:54324/api/v1/messages"; then
              echo "Mailpit API answered on attempt $i"
              exit 0
            fi
            sleep 1
          done
          echo "Mailpit API at http://127.0.0.1:54324/api/v1/messages never answered 2xx within 30s after supabase start" >&2
          exit 1

      # One retry, first failure annotated — same contract as `verify`'s step.
      - name: supabase db reset
        run: |
          if supabase db reset; then exit 0; fi
          echo "::warning::supabase db reset failed once (runner Docker?) — retrying the step a single time"
          supabase db reset

      - name: Set local app-role password (never via seed.sql)
        run: pnpm db:local-credentials

      # apps/app/qa/browser.mjs uses full `puppeteer`, which downloads a
      # pinned Chrome for Testing build at install time.
      - name: Ensure puppeteer's pinned Chrome is installed
        working-directory: apps/app
        run: pnpm exec puppeteer browsers install chrome

      # The Chrome for Testing build that puppeteer@24.10.2 pins needs shared
      # libraries the runner image does not carry.
      - name: Install Chrome headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 \
            libatk1.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 \
            libgtk-3-0 libnspr4 libnss3 libxcomposite1 libxdamage1 \
            libxfixes3 libxkbcommon0 libxrandr2 xdg-utils

      # Reuses the harness's own launch() (including its GOPROCEED_CHROME_PATH
      # override) so this checks the exact code path `qa` below depends on.
      - name: Verify Chrome launches
        working-directory: apps/app
        run: |
          node --input-type=module -e "
          import { launch } from './qa/browser.mjs';
          const browser = await launch();
          console.log('Chrome launched:', await browser.version());
          await browser.close();
          "

      - run: pnpm --filter @goproceed/app typecheck

      # NO `pnpm --filter @goproceed/app test` HERE — A DELIBERATE OMISSION,
      # NOT A DROPPED STEP. apps/app's vitest
      # suite (unit tests plus every *.int.test.ts integration test) already
      # runs in full inside `verify` above, against this exact repository
      # state, every push and every PR. Re-running the identical suite here
      # would only re-pay the cost of a second Supabase bring-up for zero new
      # coverage. What this job adds on top of `verify` is the browser pass
      # below, which `verify`
      # cannot run at all (no Chrome, no puppeteer install there).
      - run: pnpm --filter @goproceed/app build
      - run: pnpm --filter @goproceed/app qa

      # qa/field.mjs writes every
      # generated artifact under the gitignored qa-output/ (see its own
      # header) and must never touch a tracked file.
      - name: Assert apps/app QA run left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "apps/app qa run modified the working tree:"
            git status --porcelain
            exit 1
          fi

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-qa-output
          path: apps/app/qa-output/
          retention-days: 14

  # THE `package-validate` JOB WAS REMOVED ON 2026-08-20, WITH ITS SUBJECT.
  #
  # It ran `npm --prefix prototype ci` and then `make validate`, which is
  # `scripts/validate_package.py` plus prototype's own lint/build/qa. Commit
  # a85e688 («remove») deleted `prototype/` from the tree wholesale, alongside
  # the `_to_delete/` archives — so from that commit on the job could not even
  # reach its first step: setup-node failed resolving
  # `prototype/package-lock.json` for its npm cache («Some specified paths were
  # not resolved»), red on `main` and on every branch cut from it.
  #
  # It is deleted rather than repaired because there is nothing left to point
  # it at: `validate_package.py` reads prototype's App.jsx, its pages, its
  # qa-results.json and its styles.css in 29 places. Retargeting that script at
  # the real apps is a rewrite, not a path fix, and it is recorded in TODOS.md
  # as its own slice. [2026-09-24, DEV-066: the script is deleted (BL-063).]
  #
  # What this job actually guarded, and where each half lives now:
  #   - `validate-canonical` (the doc/role guard) already runs in `verify`
  #     above, on every push — it never needed prototype/ and is unaffected.
  #   - the approved-palette standard was briefly re-homed into apps/demo so
  #     its three colour checks kept working; apps/demo was itself retired
  #     hours later (see the demo-qa note above), so that standard and the
  #     checks reading it are gone together. apps/app's colour discipline is
  #     packages/tokens + @goproceed/ui, enforced by docs/design/02-building-ui.md.
  #   - the prototype's own lint/build/qa guarded a frozen React app that no
  #     longer exists. Nothing replaces it, deliberately.
